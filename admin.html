<!doctype html>
<html lang="ja" data-shelf-mode="admin">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本棚の管理</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fontLink" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
/* 図書室の壁に作り付けの本棚。背表紙を縦書きで並べ、選んだ1冊だけが手前に出てくる */
:root {
  --wall: #e3e6e1; --wall-line: #d6dad3; --ink: #1e2421; --muted: #5d665f; --panel: #fbfaf6; --panel-line: #d9dcd4;
  --wood: #8b5a35; --wood-hi: #a8714a; --wood-dark: #5b3a21; --gold: #d8b566; --accent: #b5452f; --on-accent: #fff;
  --shadow: rgba(30, 24, 18, .28); --veil: rgba(20, 22, 20, .55); --field: #fff;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --book-h: 260px; --cover-h: 318px; --plank: 22px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --wall: #161a1a; --wall-line: #1d2222; --ink: #ebe8df; --muted: #a3aaa3; --panel: #222828; --panel-line: #343c3b;
  --wood: #5d3b22; --wood-hi: #74492a; --wood-dark: #3a2413; --gold: #e0c27a; --shadow: rgba(0,0,0,.5); --veil: rgba(0,0,0,.66); --field: #1a1f1f; color-scheme: dark } }
:root[data-theme="dark"] {
  --wall: #161a1a; --wall-line: #1d2222; --ink: #ebe8df; --muted: #a3aaa3; --panel: #222828; --panel-line: #343c3b;
  --wood: #5d3b22; --wood-hi: #74492a; --wood-dark: #3a2413; --gold: #e0c27a; --shadow: rgba(0,0,0,.5); --veil: rgba(0,0,0,.66); --field: #1a1f1f; color-scheme: dark }
@media (max-width: 560px) { :root { --book-h: 224px; --cover-h: 262px; --plank: 18px; } }

* { box-sizing: border-box; }
body { margin: 0; background: var(--wall); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  background-image: repeating-linear-gradient(90deg, transparent 0 79px, var(--wall-line) 79px 80px); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 見出し */
.top { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: end; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 4.4vw, 40px); line-height: 1.25; letter-spacing: .02em; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 46em; grid-column: 1 / -1; }
.owner { font-size: 13px; color: var(--muted); }
.owner a { color: inherit; }
.gear { justify-self: end; display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--panel-line); background: var(--panel); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.gear:hover { border-color: var(--accent); }
.adminbadge { font-size: 11px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 0 7px; margin-left: 2px; }

.tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 22px 0 18px; }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--panel-line); border-radius: 10px; padding: 0 12px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 0; outline: none; }
.search kbd { font-size: 12px; color: var(--muted); border: 1px solid var(--panel-line); border-radius: 4px; padding: 0 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--panel-line); background: var(--panel); border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--wall); border-color: var(--ink); }
.chip small { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.sort { border: 1px solid var(--panel-line); background: var(--panel); border-radius: 10px; padding: 7px 10px; }
.count { font-size: 13px; color: var(--muted); margin: 0; }
.countbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 0 8px; position: relative; }
.viewmenu { position: relative; }
.viewmenu summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 10px; border-radius: 6px; user-select: none; }
.viewmenu summary::-webkit-details-marker { display: none; }
.viewmenu summary:hover, .viewmenu[open] summary { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--panel-line); }
.vm-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 15; width: min(320px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: 0 12px 30px var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.vm-panel fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.vm-panel legend { font-size: 12px; color: var(--muted); padding: 0; margin-bottom: 4px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--panel-line); border-radius: 8px; overflow: hidden; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 7px 6px; font-size: 13px; }
.seg label + label span { border-left: 1px solid var(--panel-line); }
.seg input:checked + span { background: var(--ink); color: var(--wall); font-weight: 700; }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: -3px; }
.still, .mv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.flip { position: absolute; inset: 0; }
.flip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.flip img.on { opacity: 1; }
.mv.wait { opacity: 0; transition: opacity .3s; }
.mv.wait.on { opacity: 1; }
.notice { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--panel); border: 1px dashed var(--accent); border-radius: 10px; padding: 8px 14px; font-size: 14px; margin-bottom: 14px; }
.linkbtn { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }

/* 本棚 */
.case { position: relative; border-radius: 6px; padding: 10px 14px 0; background: var(--wood-dark); box-shadow: inset 0 0 0 6px var(--wood), 0 10px 30px var(--shadow); }
.shelf { --ih: var(--book-h); display: flex; flex-wrap: wrap; align-items: flex-end; padding: 0 8px;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0, transparent 40px, transparent calc(var(--ih) + 12px), var(--wood-hi) calc(var(--ih) + 12px), var(--wood) calc(var(--ih) + 15px), var(--wood) calc(var(--ih) + 12px + var(--plank)) ); }
.shelf.covers { --ih: var(--cover-h); gap: 0 10px; padding: 0 10px; }
.shelf.covers .slot { flex: none; }
.slot { height: calc(var(--ih) + 12px + var(--plank)); display: flex; align-items: flex-end; padding: 0 1px var(--plank); }
/* 表紙を見せて立てかける */
.cover { --c: #555; position: relative; width: calc(var(--cover-h) * .6); flex: none; height: calc(var(--cover-h) - 6px); border: 0; padding: 12px 12px 12px 18px; border-radius: 3px 8px 8px 3px; cursor: pointer; text-align: left; color: #fbf4e2;
  display: flex; flex-direction: column; gap: 8px; background: linear-gradient(90deg, rgba(0,0,0,.35) 0, rgba(255,255,255,.12) 6px, rgba(0,0,0,0) 12px), var(--c);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 4px 6px 10px rgba(0,0,0,.35); transform: perspective(700px) rotateX(4deg); transform-origin: 50% 100%; transition: transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .2s; }
.cover:hover, .cover:focus-visible { transform: perspective(700px) rotateX(0) translateY(-10px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 8px 16px 22px rgba(0,0,0,.4); z-index: 2; }
.cover .cv-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-display); font-size: 12px; color: var(--gold); border-bottom: 1px solid rgba(216,181,102,.6); padding-bottom: 6px; gap: 6px; white-space: nowrap; }
.cover .cv-top span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cover .cv-screen { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 4px; overflow: hidden; background: #0d0f0f; box-shadow: 0 0 0 2px rgba(216,181,102,.55); flex: none; }
.cover .cv-screen video, .cover .cv-screen img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
.cover .cv-title { font-family: var(--f-display); font-weight: 800; font-size: clamp(15px, calc(var(--cover-h) * .056), 19px); line-height: 1.3; text-wrap: balance; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.cover .cv-sum { font-size: 12px; line-height: 1.55; color: rgba(251,244,226,.85); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cover .cv-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; font-size: 11px; color: rgba(251,244,226,.8); }
.cover .cv-foot > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shelf.covers.hrow { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-color: var(--gold) transparent; }
.shelf.covers.hrow .slot { scroll-snap-align: start; }
.cover .stamp { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--gold); color: var(--gold); font-family: var(--f-display); font-weight: 800; font-size: 15px; flex: none; overflow: hidden; }
.cover .stamp img { width: 100%; height: 100%; object-fit: cover; }
.cover.soon { filter: saturate(.55) brightness(.85); }
@media (max-width: 560px) { .shelf.covers { gap: 0 8px; padding: 0 6px; } .cover { width: calc((100vw - 92px) / 2); max-width: calc(var(--cover-h) * .72); padding: 10px 10px 10px 14px; } .cover .cv-sum { -webkit-line-clamp: 2; } }
.cover .ghostc { display: none; }
.ghost.c { width: calc(var(--cover-h) * .6); height: calc(var(--cover-h) - 6px); writing-mode: horizontal-tb; letter-spacing: .2em; }
@media (max-width: 560px) { .ghost.c { width: calc((100vw - 92px) / 2); } }
@media (prefers-reduced-motion: reduce) { .cover { transition: none; transform: none; } }
.book { --c: #555; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px;
  width: var(--w, 60px); height: var(--h, 240px); padding: 12px 0 12px; border: 0; border-radius: 3px 3px 2px 2px; cursor: pointer; color: #f7f1e1;
  background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.10) 14%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 78%, rgba(0,0,0,.30)), var(--c);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 2px 0 0 rgba(0,0,0,.18);
  transition: transform .22s cubic-bezier(.3,1.4,.5,1), box-shadow .2s; transform-origin: 50% 100%; }
.book::before, .book::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--gold); opacity: .8; }
.book::before { top: 32px; } .book::after { bottom: 54px; }
.book:hover, .book:focus-visible { transform: translateY(-14px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 6px 10px 14px rgba(0,0,0,.35); z-index: 2; }
.book .vol { font-family: var(--f-display); font-weight: 600; font-size: 11px; letter-spacing: .05em; color: var(--gold); white-space: nowrap; }
.book .ttl { writing-mode: vertical-rl; text-orientation: upright; font-family: var(--f-display); font-weight: 800; letter-spacing: .1em; line-height: 1.15; color: #fbf4e2; text-shadow: 0 1px 0 rgba(0,0,0,.35); flex: 1; display: flex; align-items: center; overflow: hidden; padding: 10px 0 8px; }
.book .stamp { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--gold); color: var(--gold); font-family: var(--f-display); font-weight: 800; font-size: 17px; line-height: 1; overflow: hidden; }
.book .stamp img { width: 100%; height: 100%; object-fit: cover; }
.book.xthin { padding: 8px 0; }
.book.xthin::before, .book.xthin::after { left: 3px; right: 3px; height: 1px; }
.book.xthin::before { top: 26px; } .book.xthin::after { bottom: 36px; }
.book.xthin .vol { font-size: 10px; letter-spacing: 0; }
.book.xthin .ttl { letter-spacing: .02em; padding: 8px 0 6px; }
.book.xthin .stamp { width: 20px; height: 20px; border-width: 1px; font-size: 11px; }
.book.xthin .ribbon { font-size: 7px; letter-spacing: 0; height: 11px; line-height: 11px; }
.book .ribbon { top: 0; left: 0; right: 0; padding: 0; height: 13px; line-height: 13px; font-size: 9px; text-align: center; clip-path: none; border-radius: 3px 3px 0 0; letter-spacing: .1em; }
.book:has(.ribbon) { padding-top: 16px; }
.book.xthin:has(.ribbon) { padding-top: 14px; } .book.xthin:has(.ribbon)::before { top: 30px; }
.ribbon { position: absolute; top: -6px; right: 6px; background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 700; padding: 2px 5px 6px; clip-path: polygon(0 0,100% 0,100% 100%,50% 78%,0 100%); letter-spacing: .05em; }
.book.soon { filter: saturate(.55) brightness(.85); }
.ghost { width: 54px; height: calc(var(--book-h) * .9); border: 2px dashed rgba(216,181,102,.45); border-radius: 3px; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; color: rgba(241,230,207,.6); font-family: var(--f-display); font-size: 14px; letter-spacing: .3em; margin-left: 6px; }
.empty { color: #f1e6cf; padding: 60px 10px 80px; text-align: center; width: 100%; }
.empty b { font-family: var(--f-display); font-size: 20px; display: block; }

.shelfhead { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 8px; font-family: var(--f-display); font-weight: 800; font-size: 19px; }
.shelfhead:first-child { margin-top: 0; }
.shelfhead small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.thgrid { display: grid; grid-template-columns: 1fr minmax(0, 210px); gap: 8px 12px; align-items: center; }
.thgrid .lbl { min-width: 0; overflow-wrap: anywhere; }
.thgrid .lbl small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.thgrid select { border: 1px solid var(--panel-line); background: var(--field); border-radius: 7px; padding: 6px 8px; width: 100%; }
.thgrid h3 { grid-column: 1 / -1; margin: 10px 0 0; font-size: 14px; }
.foot { margin-top: 28px; font-size: 13px; color: var(--muted); max-width: 60em; }
.foot code { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 4px; padding: 0 4px; }

/* 1冊を開いたところ */
.veil { position: fixed; inset: 0; background: var(--veil); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.open { position: relative; width: min(920px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border-radius: 6px 12px 12px 6px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  display: grid; grid-template-columns: 14px minmax(0, 1.25fr) minmax(0, 1fr); animation: pull .28s cubic-bezier(.2,1.2,.4,1); }
@keyframes pull { from { transform: translateY(24px) scale(.97); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .open { animation: none; } .book { transition: none; } }
.open .edge { background: var(--c); border-radius: 6px 0 0 6px; }
.open .media { padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.screen { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; background: #111; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.screen video, .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
.screen .ph { position: absolute; inset: 0; display: grid; place-items: center; background: var(--c); color: var(--gold); font-family: var(--f-display); font-size: 64px; font-weight: 800; }
.media .cap { font-size: 12px; color: var(--muted); margin: 0; }
.open .info { padding: 22px 22px 22px 6px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.open .kicker { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.open h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.3; text-wrap: balance; }
.open .sum { margin: 0; font-weight: 700; }
.open .desc { margin: 0; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; border: 1px solid var(--panel-line); border-radius: 999px; padding: 1px 9px; background: transparent; cursor: pointer; color: var(--ink); }
.tag:hover { border-color: var(--accent); }
.plays { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.play { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; background: var(--accent); color: var(--on-accent); padding: 9px 16px; border-radius: 8px; font-weight: 700; }
.play.sub { background: transparent; color: var(--ink); border: 1px solid var(--panel-line); font-weight: 500; }
.play[aria-disabled="true"] { background: var(--panel-line); color: var(--muted); pointer-events: none; }
.x { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--panel-line); background: var(--panel); cursor: pointer; font-size: 18px; line-height: 1; z-index: 2; }
@media (max-width: 720px) { .open { grid-template-columns: 10px minmax(0, 1fr); } .open .edge { grid-row: 1 / span 2; } .open .info { grid-column: 2; padding: 0 18px 20px; } .open .media { padding: 16px 16px 4px; } .open h2 { font-size: 23px; } }

/* 設定 */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 30; box-shadow: -10px 0 40px rgba(0,0,0,.3); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--panel-line); }
.drawer header h2 { margin: 0; font-family: var(--f-display); font-size: 20px; flex: 1; }
.tabs { display: flex; gap: 4px; padding: 10px 18px 0; border-bottom: 1px solid var(--panel-line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 12px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { border-bottom-color: var(--accent); font-weight: 700; }
.pane { padding: 16px 18px 28px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.row { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--panel-line); border-radius: 8px; }
.row .dot { width: 26px; height: 34px; border-radius: 3px; background: var(--c); color: var(--gold); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 13px; }
.row .nm { min-width: 0; overflow-wrap: anywhere; }
.row .nm small { display: block; color: var(--muted); font-size: 12px; }
.row .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 1px solid var(--panel-line); background: var(--field); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.danger { color: #b3261e; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field span { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--panel-line); background: var(--field); border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0; }
.field textarea { min-height: 70px; resize: vertical; }
.field input[type="color"] { padding: 2px; height: 38px; }
.links { display: flex; flex-direction: column; gap: 6px; }
.linkrow { display: grid; grid-template-columns: 110px 1fr auto; gap: 6px; }
.fonts { border: 0; padding: 0; margin: 0; }
.fonts legend { font-size: 12px; color: var(--muted); padding: 0; margin-bottom: 6px; }
.fontgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

  function move(id, dir) {

    if (j < 0 || j >= list.length) return; const v = list[i].volume; list[i].volume = list[j].volume; list[j].volume = v;
    if (list[i].volume === list[j].volume) list[i].volume += dir; persist();
  }
  // 本棚まるごと（apps あり）は入れ替え、1冊分（format: app-shelf-book / book / 本1件）は追加・上書き
  function importJson(texts) {
    // まず全部のファイルを確かめ、1つでも問題があれば何も変えずに理由を出す
    let whole = null; const books = []; const errs = [];
    for (const [name, text] of texts) {
      let raw; try { raw = JSON.parse(text); } catch (e) { errs.push(`${name}：JSONの書き方に誤りがあります（カンマやかっこの抜けがないか確かめてください）。`); continue; }
      if (raw && typeof raw === 'object' && !Array.isArray(raw) && 'apps' in raw) { const e = checkShelf(raw); if (e.length) errs.push(`${name}：${e.join(' ')}`); else whole = raw; }
      else if (raw && typeof raw === 'object' && !Array.isArray(raw) && 'book' in raw) { const e = checkBook(raw.book, '本'); if (e.length) errs.push(`${name}：${e.join(' ')}`); else books.push(raw.book); }
      else if (Array.isArray(raw) && raw.length) { const e = raw.flatMap((b, i) => checkBook(b, `${i + 1}冊目`)); if (e.length) errs.push(`${name}：${e.slice(0, 6).join(' ')}`); else books.push(...raw); }
      else if (raw && typeof raw === 'object' && !Array.isArray(raw) && 'title' in raw) { const e = checkBook(raw, '本'); if (e.length) errs.push(`${name}：${e.join(' ')}`); else books.push(raw); }
      else errs.push(`${name}：本棚（apps のあるJSON）か、1冊分（book のあるJSON）として読めませんでした。`);
    }
    if (errs.length) { $('#dataStatus').textContent = '読み込みをやめました。本棚は変わっていません。' + errs.join(' '); return; }
    const msg = [];
    // 候補を作ってから、一度に入れ替える
    const next = whole ? normalize(whole) : structuredClone(cfg);
    if (whole) msg.push(`本棚を入れ替えました（${next.apps.length}冊）`);
    if (books.length) {
      let added = 0, updated = 0;
      normalize({ apps: books }).apps.forEach((b, k) => { const gname = str(books[k].genreName).trim();
        const i = next.apps.findIndex((x) => x.id === b.id); if (i >= 0) { next.apps[i] = b; updated++; } else { if (!b.volume || next.apps.some((x) => x.volume === b.volume)) b.volume = Math.max(0, ...next.apps.map((x) => x.volume)) + 1; next.apps.push(b); added++; }
        if (b.genre && !next.genres.some((g) => g.id === b.genre)) next.genres.push({ id: b.genre, name: gname || b.genre, thickness: 'inherit', color: '' }); });
      msg.push(`${added ? `${added}冊を追加` : ''}${added && updated ? '、' : ''}${updated ? `${updated}冊を上書き（同じIDの本があったため）` : ''}しました`);
    }
    cfg = next; persist(); renderDrawer();
    $('#dataStatus').textContent = msg.join('。') + '。' + savedNote();
  }
  function download(name, obj, statusEl) {
    const text = JSON.stringify(obj, null, 2);
    try { const url = URL.createObjectURL(new Blob([text], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      if (statusEl) statusEl.textContent = `${name} を書き出しました。保存されない場合は「JSONをコピー」を使ってください。`; } catch (e) { if (statusEl) statusEl.textContent = '書き出せませんでした。「JSONをコピー」を使ってください。'; }
  }
  const stamp = () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };
  const exportJson = () => download('shelf.json', cfg, $('#dataStatus'));
  const exportBackup = () => download(`shelf-backup-${stamp()}.json`, cfg, $('#dataStatus'));
  function exportBook(id) {
    const b = cfg.apps.find((x) => x.id === id); if (!b) return;
    download(`book-${b.id}.json`, { format: 'app-shelf-book', version: 1, book: { ...b, genreName: genreName(b.genre) } }, null);
    flash(`「${b.title}」を book-${b.id}.json として書き出しました。ほかの本棚の「バックアップから戻す」で選ぶと追加できます。`);
  }

  // ---- 操作 ----
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-close]');
    if (e.target === $('#veil')) return closeBook();
    if (!t) return;
    // 入力中の変更（0.3秒待ち）があれば、画面を切りかえる前に保存する
    if (t.closest('#drawer') && !t.matches('[data-act="rmlink"], [data-act="addlink"]')) flushLive();
    if (t.dataset.mark) { toggleMark(t.dataset.mark); renderAll(); return openBook(t.dataset.mark, true); }
    if (t.matches('.book, .cover')) return openBook(t.dataset.id);
    if (t.matches('[data-close]')) return closeBook();
    if (t.matches('.chip')) { ui.genre = t.dataset.g; store.set(UIKEY, JSON.stringify(ui)); return renderAll(); }
    if (t.matches('.tag')) { closeBook(); $('#q').value = t.dataset.tag; ui.genre = 'all'; return renderAll(); }
    if (t.id === 'openSettings') return openDrawer();
    if (t.id === 'noticeReset') { tab = 'data'; pendingDelete = 'reset'; return openDrawer(); }
    if (t.dataset.tab) { tab = t.dataset.tab; editing = null; pendingDelete = null; return renderDrawer(); }
    const act = t.dataset.act; if (!act) return;
    const id = t.dataset.id;
    ({
      close: closeDrawer, new: () => { editing = '__new'; renderDrawer(); $('#f_title').focus(); }, edit: () => { editing = id; renderDrawer(); }, back: () => { editing = null; renderDrawer(); },
      up: () => move(id, -1), down: () => move(id, 1), del: () => { pendingDelete = id; renderDrawer(); }, 'del-no': () => { pendingDelete = null; renderDrawer(); },
      'del-yes': () => { const a = cfg.apps.find((x) => x.id === id); cfg.apps = cfg.apps.filter((x) => x.id !== id); pendingDelete = null; persist(); flash(`「${a ? a.title : ''}」を本棚から外しました。${savedNote()}`); },
      addlink: () => $('#linkRows').insertAdjacentHTML('beforeend', linkRow()), rmlink: () => { const f = t.closest('form'); t.closest('.linkrow').remove(); if (f && f.dataset.orig) saveBook(f, true); },
      gadd: () => { const n = $('#g_new').value.trim(); if (!n) return $('#g_new').focus();
        if (cfg.genres.some((g) => g.name === n)) { flash(`「${n}」というジャンルはもうあります。`); return; }
        let gid = slug(n.normalize('NFKC')); if (/^app-/.test(gid)) gid = 'g-' + Date.now().toString(36);
        const base0 = gid; let k = 2; while (cfg.genres.some((g) => g.id === gid)) gid = `${base0}-${k++}`; // IDは重ねない
        cfg.genres.push({ id: gid, name: n, thickness: 'inherit', color: PALETTE[cfg.genres.length % PALETTE.length] }); persist(); flash(`ジャンル「${n}」を追加しました。${savedNote()}`); },
      gdel: () => { pendingDelete = 'g:' + t.dataset.gid; renderDrawer(); },
      'gdel-yes': () => { const g = t.dataset.gid; cfg.genres = cfg.genres.filter((x) => x.id !== g); cfg.apps.forEach((a) => { if (a.genre === g) a.genre = ''; }); pendingDelete = null; persist(); },
      'th-clear': () => { cfg.apps.forEach((a) => (a.thickness = 'inherit')); persist(); },
      export: exportJson, 'export-backup': exportBackup, bexport: () => exportBook(cfg.apps.some((x) => x.id === id) ? id : editing),
      copy: () => { const text = JSON.stringify(cfg, null, 2); const st = $('#dataStatus'); const fail = () => { st.textContent = 'コピーできませんでした。GitHub Pages で開いて「バックアップを書き出す」を使ってください。'; }; if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => (st.textContent = '本棚の中身をコピーしました。テキストファイルに貼り付けて shelf.json という名前で保存できます。'), fail); else fail(); },
      import: () => { const v = $('#jsonIn').value.trim(); if (!v) { $('#dataStatus').textContent = 'ファイルを選ぶか、JSONを貼り付けてください。'; return; } importJson([['貼り付けたJSON', v]]); },
      reset: () => { pendingDelete = 'reset'; renderDrawer(); },
      'reset-yes': () => { store.del(KEY); cfg = structuredClone(base); edited = false; pendingDelete = null; renderAll(); renderDrawer(); $('#dataStatus') && ($('#dataStatus').textContent = '元の本棚に戻しました。'); },
    }[act] || (() => {}))();
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.getAttribute('id') === 'bookForm') saveBook(e.target);
    if (e.target.getAttribute('id') === 'siteForm') liveSite(e.target);
  });
  document.addEventListener('change', (e) => {
    if (e.target.dataset.font !== undefined) { cfg.site.font = e.target.value; persistQuiet(); }
    if (e.target.name === 'colorBy') { cfg.site.colorBy = e.target.value; if (cfg.site.colorBy === 'genre') cfg.genres.forEach((g, i) => { if (!g.color) g.color = PALETTE[i % PALETTE.length]; }); persist(); }
    if (e.target.dataset.gc !== undefined) { const g = cfg.genres[+e.target.dataset.gc]; if (g) { g.color = e.target.value; if (cfg.site.colorBy !== 'genre') cfg.site.colorBy = 'genre'; persist(); } }
    if (e.target.name === 'view') { ui.view = e.target.value; store.set(UIKEY, JSON.stringify(ui)); renderShelf(); }
    if (e.target.name === 'layout') { ui.layout = e.target.value; store.set(UIKEY, JSON.stringify(ui)); renderShelf(); }
    if (e.target.dataset.th === 'site') { cfg.site.thickness = e.target.value; persist(); }
    if (e.target.dataset.thGenre) { const g = cfg.genres.find((x) => x.id === e.target.dataset.thGenre); if (g) { g.thickness = e.target.value; persist(); } }
    if (e.target.dataset.thBook) { const a = cfg.apps.find((x) => x.id === e.target.dataset.thBook); if (a) { a.thickness = e.target.value; persist(); } }
    if (e.target.id === 'sort') { ui.sort = e.target.value; store.set(UIKEY, JSON.stringify(ui)); renderShelf(); }
    if (e.target.dataset.gi !== undefined) { const g = cfg.genres[+e.target.dataset.gi]; const v = e.target.value.trim(); if (g && v) { g.name = v; persist(); } }
    if (e.target.id === 'fileIn' && e.target.files.length) { Promise.all([...e.target.files].map((f) => f.text().then((t) => [f.name, t]))).then(importJson); }
  });
  $('#q').addEventListener('input', renderShelf);
  function liveSite(form) { if (!form || !form.isConnected) return; const fd = new FormData(form); ['title', 'subtitle', 'owner', 'ownerUrl', 'accent', 'volumeLabel'].forEach((k) => (cfg.site[k] = String(fd.get(k) ?? '').trim())); if (!cfg.site.title) cfg.site.title = 'わたしの本棚'; persistQuiet(); }
  // 入力が止まってから少し待って保存する。画面を切りかえるときは flushLive() ですぐ保存する
  let liveT = null, liveFn = null;
  const schedule = (fn, ms) => { clearTimeout(liveT); liveFn = fn; liveT = setTimeout(() => { const f = liveFn; liveFn = null; liveT = null; f && f(); }, ms); };
  function flushLive() { if (!liveFn) return; clearTimeout(liveT); const f = liveFn; liveFn = null; liveT = null; f(); }
  const liveEdit = (e) => {
    const f = e.target.closest && e.target.closest('form'); if (!f) return;
    const id = f.getAttribute('id');
    if (id === 'siteForm' && !('font' in e.target.dataset)) schedule(() => liveSite(f), 250);
    if (id === 'bookForm' && f.dataset.orig) schedule(() => saveBook(f, true), 300);
  };
  document.addEventListener('input', liveEdit);
  document.addEventListener('change', liveEdit);
  // コマ送り：見えているものだけ、0.7秒ごとに次の画像へ
  const flipSeen = new WeakSet(); let fio = null;
  function watchFlips() {
    if (fio) fio.disconnect();
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('[data-flip]').forEach((f) => flipSeen.add(f)); return; }
    fio = new IntersectionObserver((ents) => ents.forEach((en) => { en.isIntersecting ? flipSeen.add(en.target) : flipSeen.delete(en.target); }), { threshold: 0.3 });
    document.querySelectorAll('[data-flip]').forEach((f) => fio.observe(f));
  }
  setInterval(() => {
    if (still.matches || document.hidden) return;
    document.querySelectorAll('[data-flip]').forEach((f) => {
      if (!flipSeen.has(f) && !f.closest('.veil')) return;
      const imgs = f.children; if (imgs.length < 2) return;
      let i = [...imgs].findIndex((x) => x.classList.contains('on'));
      imgs[i]?.classList.remove('on'); imgs[(i + 1) % imgs.length].classList.add('on');
    });
  }, 700);
  // 動画が流れ始めたら止め絵の上に出す。読み込めないときは止め絵のまま
  document.addEventListener('playing', (e) => { if (e.target.classList && e.target.classList.contains('mv')) e.target.classList.add('on'); }, true);
  document.addEventListener('click', (e) => { const m = $('#viewmenu'); if (m.open && !m.contains(e.target)) m.open = false; });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if ($('#viewmenu').open) { $('#viewmenu').open = false; $('#viewmenu summary').focus(); } else if (!$('#veil').hidden) closeBook(); else if (!$('#drawer').hidden) closeDrawer(); }
    if (e.key === 'Tab') { if (!$('#veil').hidden) trapTab(e, $('#veil .open')); else if (!$('#drawer').hidden) trapTab(e, $('#drawer')); }
    if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderShelf, 150); });
  // 公開予定の時刻をまたいだら、棚と開いている本の両方を描き直す（「近日」が外れ、遊ぶボタンが押せるようになる）
  let relSig = '';
  const relState = () => (cfg ? cfg.apps.map((a) => (released(a) ? 1 : 0)).join('') : '');
  function checkRelease() { const s = relState(); if (s === relSig) return; const first = !relSig; relSig = s; if (first) return; renderShelf(); if (openId && !$('#veil').hidden) openBook(openId, true); }
  setInterval(checkRelease, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkRelease(); });
  load();
})();
</script>
